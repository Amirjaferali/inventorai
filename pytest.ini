[pytest]
# G-IRB Implementation-Readiness Baseline — governed test configuration (additive only).
#
# The governed suite is the active tests/ directory. The immutable historical
# score-93 snapshot under benchmarks/ contains a copied test_*.py file
# (benchmarks/baseline_20260519_2159_score93_engine_checkpoint/test_normalize_output_contract.py)
# which must never be run or modified (benchmarks/README.md immutability rule);
# restricting testpaths to tests/ deliberately excludes it from collection.
testpaths = tests

# A test marked xfail that unexpectedly passes is treated as a failure (nonzero exit),
# governing the "zero ungoverned unexpected passes" requirement. The single accepted
# ADR-003 xfail (tests/test_f011_progression_quality_gate.py) must remain failing.
xfail_strict = true
