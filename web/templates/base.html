<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}InventorAI{% endblock %}</title>
<style>
/* G-UX-SHELL shared application-shell baseline. Minimal; no framework, no JS.
   Accessibility/disclosure baseline only — not a visual redesign. */
*:focus-visible{outline:3px solid #2c6fbb;outline-offset:2px}
a.skip-link{position:absolute;left:-9999px;top:auto;background:#fff;color:#2c3e50;padding:8px 12px;border:2px solid #2c3e50;border-radius:4px;z-index:1000}
a.skip-link:focus{left:8px;top:8px;position:fixed}
.app-header{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:760px;margin:0 auto;padding:10px 20px;border-bottom:1px solid #d4dde6}
.app-header .brand{font-weight:600;color:#2c3e50}
.app-header .temp-session{font-size:12px;color:#555;white-space:nowrap}
</style>
{% block head %}{% endblock %}
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<header class="app-header">
<span class="brand">InventorAI</span>
<span class="temp-session">Temporary session{% if request.path != '/data-and-session' %} <a href="/data-and-session">Learn more</a>{% endif %}</span>
</header>
<main id="main-content">
{% block content %}{% endblock %}
</main>
</body>
</html>
