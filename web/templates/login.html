{% extends "base.html" %}
{% block title %}{{ t('UI_TITLE_LOGIN') }}{% endblock %}
{% block head %}
<style>
.auth-wrap{max-width:520px;margin:48px auto;padding:0 20px;color:#222;font-family:sans-serif}
.auth-wrap h1{color:#2c3e50;margin-bottom:6px}
label{display:block;margin:14px 0 4px 0;font-size:14px;color:#333}
input[type=email],input[type=password]{width:100%;padding:10px;font-size:16px;border:1px solid #ccc;border-radius:4px}
button{margin-top:16px;padding:10px 24px;background:#2c3e50;color:#fff;border:none;border-radius:4px;font-size:16px;cursor:pointer}
.form-error{color:#c0392b;font-size:13px;margin:8px 0}
.links{margin-top:16px;font-size:14px}
</style>
{% endblock %}
{% block content %}
<div class="auth-wrap">
<h1>{{ t('UI_A_LOGIN_001') }}</h1>
{% if login_error %}
  <p class="form-error" role="alert">{{ t('UI_A_MSG_LOGIN') }}</p>
{% endif %}
<form method="POST" action="/login">
  <label for="email">{{ t('UI_A_LOGIN_002') }}</label>
  <input type="email" id="email" name="email" autocomplete="email" required>
  <label for="password">{{ t('UI_A_LOGIN_003') }}</label>
  <input type="password" id="password" name="password" autocomplete="current-password" required>
  <button type="submit">{{ t('UI_A_LOGIN_001') }}</button>
</form>
<p class="links">
  <a href="/recover">{{ t('UI_A_LOGIN_004') }}</a><br>
  <a href="/register">{{ t('UI_A_LOGIN_005') }}</a>
</p>
</div>
{% endblock %}
