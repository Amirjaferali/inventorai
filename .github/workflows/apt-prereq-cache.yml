name: Seed the Chromium prerequisite package cache

# APT-PREREQ-CACHE-01. Seeds ONE GitHub Actions cache entry with the Ubuntu package
# archives (.deb files) that the FULL shards' Chromium prerequisite install downloads,
# so pull requests into the execution base can restore them instead of fetching every
# package from the Ubuntu mirror. A cache saved by a pull-request run is visible to that
# pull request only; one saved here, on the base branch, is visible to every pull
# request into it.
#
# Boundaries: runs only on a push to the execution base (a merge) or by manual dispatch,
# never on a pull request; read-only token; checks out the pushed base commit only; runs
# no test, calls no workflow, pushes nothing and creates no ref, so it cannot trigger
# itself or the protected pull-request route. It reuses the shards' pip install, cache
# key and bounded Chromium installer byte for byte (pinned in tests/test_ci_full_suite.py)
# and saves only the package archives that installer left in /var/cache/apt/archives,
# never an installed system. The cached files are download candidates: the installer in
# every shard still runs `apt-get update` against the signed Ubuntu index and apt uses a
# file only when it matches that index.

on:
  push:
    branches: [feature/atomic-json-session-persistence]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apt-prereq-cache
  cancel-in-progress: false

jobs:
  seed:
    name: Seed the Chromium prerequisite package cache
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out the pushed base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up the repository-required Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install existing pinned inputs into an isolated environment
        run: |
          echo "INVENTORAI_DB_PATH=$RUNNER_TEMP/inventorai-ci.sqlite" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright" >> "$GITHUB_ENV"
          python -m venv "$RUNNER_TEMP/inventorai-venv"
          echo "$RUNNER_TEMP/inventorai-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/inventorai-venv/bin/python" -m pip install --disable-pip-version-check --no-input -r requirements.txt -r tests/requirements-draft-l2.txt
          "$RUNNER_TEMP/inventorai-venv/bin/python" -m pip check
          "$RUNNER_TEMP/inventorai-venv/bin/python" -m pip freeze

      - name: Compute the Chromium prerequisite cache key
        # APT-PREREQ-CACHE-01. ONE exact key, computed BEFORE anything is installed,
        # byte-identical in .github/workflows/apt-prereq-cache.yml (which seeds it on the
        # base branch): runner image, pinned Playwright version and the SHA-256 of the
        # apt prerequisites Playwright reports missing. No key (an unknown image) means
        # no cache: the installer below then runs exactly as on a miss.
        id: aptkey
        run: |
          set -euo pipefail
          if [ -z "${ImageOS:-}" ] || [ -z "${ImageVersion:-}" ]; then
            echo "::warning::Runner image identity unavailable; no apt prerequisite cache"
            echo "key=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pw="$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')"
          deps="$(python -m playwright install-deps --dry-run chromium | sha256sum | cut -c1-32)"
          echo "key=apt-prereq-chromium-v1-${ImageOS}-${ImageVersion}-pw${pw}-${deps}" >> "$GITHUB_OUTPUT"

      - name: Stop when the runner image identity is unavailable
        if: steps.aptkey.outputs.key == ''
        run: |
          echo "::error::Runner image identity unavailable; nothing can be seeded under an exact key"
          exit 1

      - name: Install the matching Chromium and Linux prerequisites
        # Bounded, fail-closed install (CI Correction 01). An unbounded apt-get
        # update inside `playwright install --with-deps` once hung a runner for the
        # whole job. Linux prerequisites install as root under a root-owned hard
        # deadline that kills the whole process group; any process still holding
        # an apt / dpkg lock is then killed before a retry. The browser installs as
        # the runner user into the existing PLAYWRIGHT_BROWSERS_PATH. Same packages
        # and browser as `--with-deps`; fixed try budget; never skipped.
        timeout-minutes: 20
        run: |
          set -euo pipefail
          PY="$(command -v python)"
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' 'DPkg::Lock::Timeout "60";' \
            | sudo tee /etc/apt/apt.conf.d/99inventorai-ci-bounded >/dev/null
          apt_lock_holders() {
            { sudo find /proc -mindepth 3 -maxdepth 3 -path '/proc/[0-9]*/fd/*' \( \
                -lname /var/lib/dpkg/lock -o -lname /var/lib/dpkg/lock-frontend \
                -o -lname /var/lib/apt/lists/lock -o -lname /var/cache/apt/archives/lock \) \
                2>/dev/null || true; } | cut -d/ -f3 | sort -u
          }
          release_apt() {
            local pids
            pids="$(apt_lock_holders)"
            if [ -n "$pids" ]; then
              echo "::warning::Killing leftover apt/dpkg lock holders: $pids"
              sudo kill -KILL $pids 2>/dev/null || true
              sleep 2
            fi
            if [ -n "$(apt_lock_holders)" ]; then
              echo "::error::apt/dpkg locks are still held after cleanup"
              ps -eo pid,pgid,user,etime,args | grep -E 'apt|dpkg' || true
              return 1
            fi
            sudo dpkg --configure -a
          }
          install_ok=0
          for try in 1 2 3; do
            echo "::group::Linux prerequisites for Chromium (try $try of 3)"
            rc=0
            # sudo drops LD_LIBRARY_PATH, which the shared setup-python interpreter needs.
            sudo timeout --kill-after=20s 240s env LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" \
              "$PY" -m playwright install-deps chromium || rc=$?
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then install_ok=1; break; fi
            echo "::warning::Linux prerequisites try $try failed (exit $rc; 124 or 137 = deadline reached)"
            release_apt
          done
          if [ "$install_ok" -ne 1 ]; then
            echo "::error::Linux prerequisites for Chromium were not installed after 3 bounded tries"
            exit 1
          fi
          install_ok=0
          for try in 1 2; do
            rc=0
            timeout --kill-after=20s 180s python -m playwright install chromium || rc=$?
            if [ "$rc" -eq 0 ]; then install_ok=1; break; fi
            echo "::warning::Chromium download try $try failed (exit $rc; 124 or 137 = deadline reached)"
          done
          if [ "$install_ok" -ne 1 ]; then
            echo "::error::Chromium was not installed after 2 bounded tries"
            exit 1
          fi

      - name: Collect the package archives the installer downloaded
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(/var/cache/apt/archives/*.deb)
          if [ "${#debs[@]}" -eq 0 ]; then
            echo "::error::The installer left no package archive in /var/cache/apt/archives; nothing to seed"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/apt-prereq-debs"
          cp -- "${debs[@]}" "$RUNNER_TEMP/apt-prereq-debs/"
          for f in "$RUNNER_TEMP"/apt-prereq-debs/*.deb; do
            dpkg-deb --info "$f" >/dev/null
          done
          echo "Seeding ${#debs[@]} package archive(s):"
          ls -l "$RUNNER_TEMP/apt-prereq-debs"

      - name: Save the package archives under the exact key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-prereq-debs
          key: ${{ steps.aptkey.outputs.key }}
